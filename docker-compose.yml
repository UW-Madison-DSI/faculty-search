version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - /volumes/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:2.3-latest
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - /volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  fastapi:
    container_name: fastapi
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      AUTHOR_DIR: ./data/raw/campus_users
      MILVUS_ALIAS: default
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      DEBUG: 1
    depends_on:
      - "milvus"
    command:
      [
        "uvicorn",
        "api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8765",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*"
      ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastapi.rule=Host(`discover.datascience.wisc.edu`)"
      - "traefik.http.routers.fastapi.entrypoints=api"
      - "traefik.http.routers.fastapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8765"

  flask:
    container_name: flask
    # image: ghcr.io/jasonlo/community-search-frontend:20230927-2022 # pull from ghcr for CI
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      DEBUG: 1
      UPLOAD_FOLDER: '/tmp'
      AMIL_SERVER: '${MAIL_SERVER}'
      MAIL_USERNAME: '${MAIL_USERNAME}'
      MAIL_PASSWORD: '${MAIL_PASSWORD}'
      MAIL_PORT: '${MAIL_PORT}'
      MAIL_SENDER: '${MAIL_SENDER}'
      MAIL_RECIPIENT: '${MAIL_RECIPIENT}'
      MAIL_ANOTHER_RECIPIENT: '${MAIL_ANOTHER_RECIPIENT}'
    volumes:
      - ./frontend:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask.rule=Host(`discover.datascience.wisc.edu`)"
      - "traefik.http.routers.flask.entrypoints=websecure"
      - "traefik.http.routers.flask.tls.certresolver=letsencrypt"
      - "traefik.http.services.flask.loadbalancer.server.port=8080"

  traefik:
    container_name: traefik
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8765:8765"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /volumes/traefik:/letsencrypt
